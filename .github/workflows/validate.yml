name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Shell, Kickstart and manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD || git diff --check

      - name: Validate in Fedora 44
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -w /src \
            fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf install -y ShellCheck pykickstart

              while IFS= read -r -d "" script; do
                echo "bash -n: $script"
                bash -n "$script"
              done < <(find scripts build -type f -name "*.sh" -print0)

              shellcheck scripts/*.sh build/*.sh
              ksvalidator kickstart/fedora-gnome.ks

              for manifest in packages/rpm.txt packages/flatpak.txt; do
                duplicates="$(grep -Ev "^[[:space:]]*(#|$)" "$manifest" | sort | uniq -d)"
                if [[ -n "$duplicates" ]]; then
                  echo "Entradas duplicadas em $manifest:" >&2
                  printf "%s\n" "$duplicates" >&2
                  exit 1
                fi
              done
            '
