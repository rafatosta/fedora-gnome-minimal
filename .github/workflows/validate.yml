name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Shell, Kickstart, compose and manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD

      - name: Validate in Fedora 44
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -w /src \
            fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf install -y ShellCheck pykickstart libxml2 python3

              while IFS= read -r -d "" script; do
                echo "bash -n: $script"
                bash -n "$script"
              done < <(find scripts build -type f -name "*.sh" -print0)

              shellcheck scripts/*.sh build/*.sh
              ksvalidator kickstart/fedora-gnome.ks
              xmllint --noout compose/comps.xml compose/variants.xml
              python3 -m py_compile compose/fedora-gnome-minimal.conf

              # Política deliberada: armazenamento interativo e usuário somente
              # no primeiro boot gráfico via GNOME Initial Setup.
              if grep -Eq "^[[:space:]]*(clearpart|autopart|part|partition|user)[[:space:]]" kickstart/fedora-gnome.ks; then
                echo "Kickstart não pode automatizar armazenamento nem criar usuário." >&2
                exit 1
              fi
              grep -Eq "^[[:space:]]*rootpw[[:space:]]+--lock([[:space:]]|$)" kickstart/fedora-gnome.ks
              grep -q "gnome-initial-setup" compose/comps.xml
              grep -q "gdm" compose/comps.xml
              grep -q "bootloader --sdboot" kickstart/fedora-gnome.ks

              for manifest in packages/rpm.txt packages/flatpak.txt; do
                duplicates="$(grep -Ev "^[[:space:]]*(#|$)" "$manifest" | sort | uniq -d)"
                if [[ -n "$duplicates" ]]; then
                  echo "Entradas duplicadas em $manifest:" >&2
                  printf "%s\n" "$duplicates" >&2
                  exit 1
                fi
              done
            '
