name: Build ISO

on:
  workflow_dispatch:
    inputs:
      fedora_release:
        description: Fedora release used by the compose container
        required: true
        default: "44"
        type: string
      publish_release:
        description: Publish the ISO as a GitHub prerelease instead of a temporary Actions artifact
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

env:
  FEDORA_RELEASE: ${{ inputs.fedora_release || '44' }}

jobs:
  build:
    name: Fedora ${{ inputs.fedora_release || '44' }} x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h /

      - name: Build full package-based installer ISO
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            --security-opt label=disable \
            -e FEDORA_RELEASE="$FEDORA_RELEASE" \
            -v "$PWD:/work" \
            -w /work \
            "fedora:${FEDORA_RELEASE}" \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                pungi \
                lorax \
                createrepo_c \
                genisoimage \
                isomd5sum \
                pykickstart \
                libcomps

              bash ./build/build-iso.sh
            '

      - name: Show build failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::Generated build files"
          sudo find dist -maxdepth 8 -type f -printf '%p (%s bytes)\n' 2>/dev/null | tail -n 500 || true
          echo "::endgroup::"

          echo "::group::pungi.log"
          if [[ -f dist/pungi.log ]]; then
            sudo tail -n 500 dist/pungi.log
          else
            echo "dist/pungi.log was not generated."
          fi
          echo "::endgroup::"

          echo "::group::Pungi phase logs"
          sudo find dist/pungi -type f -path '*/logs/*' -print -exec tail -n 120 {} \; 2>/dev/null || true
          echo "::endgroup::"

      - name: Normalize ownership and verify checksum
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist 2>/dev/null || true
          if [[ -f dist/fedora-gnome-minimal.iso ]]; then
            sha256sum -c dist/fedora-gnome-minimal.iso.sha256
            ls -lh dist/fedora-gnome-minimal.iso dist/fedora-gnome-minimal.iso.sha256
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            dist/pungi.log
            dist/pungi/**/logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload temporary ISO artifact
        if: ${{ success() && github.event_name == 'workflow_dispatch' && !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: fedora-gnome-minimal-${{ env.FEDORA_RELEASE }}
          path: |
            dist/fedora-gnome-minimal.iso
            dist/fedora-gnome-minimal.iso.sha256
          compression-level: 0
          retention-days: 1

      - name: Publish manual build as prerelease
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/fedora-gnome-minimal.iso \
            dist/fedora-gnome-minimal.iso.sha256 \
            --target "$GITHUB_SHA" \
            --title "Fedora GNOME Minimal build #${GITHUB_RUN_NUMBER}" \
            --notes "Fedora ${FEDORA_RELEASE} x86_64 full package-based installer composed with Pungi + Lorax. RPM repository is embedded in the ISO; installation does not depend on downloading the Fedora package set." \
            --prerelease

      - name: Publish tagged release
        if: ${{ success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/fedora-gnome-minimal.iso \
              dist/fedora-gnome-minimal.iso.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/fedora-gnome-minimal.iso \
              dist/fedora-gnome-minimal.iso.sha256 \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
