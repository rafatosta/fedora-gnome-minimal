# Fedora GNOME Minimal - Pungi compose
#
# Fluxo documentado pelo Pungi para uma mídia de instalação package-based:
# pkgset -> gather -> createrepo -> buildinstall (Lorax) -> createiso.

release_name = "Fedora GNOME Minimal"
release_short = "FGM"
release_version = "44"
release_is_layered = False
release_type = "ga"
compose_type = "test"

bootable = True
comps_file = {
    "scm": "file",
    "repo": "",
    "file": "compose/comps.xml",
}
variants_file = {
    "scm": "file",
    "repo": "",
    "file": "compose/variants.xml",
}

tree_arches = ["x86_64"]
tree_variants = ["Minimal"]

# Consumimos os repositórios oficiais do Fedora diretamente, sem Koji local.
pkgset_source = "repos"
pkgset_repos = {
    "x86_64": [
        "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/",
        "https://download.fedoraproject.org/pub/fedora/linux/updates/44/Everything/x86_64/",
    ],
}
# Os RPMs vêm dos repositórios oficiais e permanecem com suas assinaturas Fedora.
sigkeys = [None]

runroot = False

# Resolver dependências a partir do único grupo/ambiente definido em comps.xml.
gather_method = "deps"
gather_backend = "dnf"
greedy_method = "build"
check_deps = True
repoclosure_backend = "dnf"
repoclosure_strictness = [("^Minimal$", {"x86_64": "fatal"})]

createrepo_c = True
createrepo_checksum = "sha256"
createrepo_database = True

# O Lorax cria o runtime oficial do Anaconda e os artefatos de boot.
buildinstall_method = "lorax"
buildinstall_kickstart = {
    "scm": "file",
    "repo": "",
    "file": "kickstart/fedora-gnome.ks",
}
lorax_options = [
    ("^Minimal$", {
        "x86_64": {
            "nomacboot": True,
            "noupgrade": True,
        },
    }),
]

# Apenas mídia binária x86_64; não criamos ISO de fontes.
createiso_skip = [
    ("^Minimal$", {"src": True}),
]

image_name_format = "fedora-gnome-minimal-%(arch)s-%(version)s.iso"
image_volid_formats = ["FGM-%(version)s-%(arch)s"]
media_checksums = ["sha256"]
media_checksum_one_file = True
media_checksum_base_filename = "fedora-gnome-minimal-%(version)s-%(arch)s"
